name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Check Svelte types and routes
        run: pnpm check

      - name: Lint source
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser end-to-end tests
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Enforce Lighthouse budgets
        run: |
          export CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          pnpm test:performance

      - name: Preserve test and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          include-hidden-files: true
          path: |
            playwright-report/
            .lighthouseci/reports/
